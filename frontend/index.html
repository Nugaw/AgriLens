<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriLens — कृषि लेन्स</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>
<header>
  <div><h1>🌾 <span data-t="title"></span></h1><p data-t="sub"></p></div>
  <div class="right">
    <button id="fsDown" title="A−">A−</button><button id="fsUp" title="A+">A+</button>
    <div class="lang"><button id="ne">नेपाली</button><button id="en">EN</button></div>
    <button id="theme">🌓</button>
  </div>
</header>
<div id="banner" hidden></div>
<nav id="tabs"></nav>
<main>
 <!-- बाली -->
 <section id="plant" class="card on">
  <h2 data-t="plantH"></h2><p class="hint" data-t="plantHint"></p>
  <div data-pick="plant"></div>
  <input id="plantNote" data-p="note">
  <button class="go" data-t="analyze" id="plantGo"></button>
  <div class="out" id="plantOut"></div>
  <h3 data-t="history"></h3><div id="plantHist" class="histlist"></div>
 </section>
 <!-- लेबल -->
 <section id="label" class="card">
  <h2 data-t="labelH"></h2><p class="hint" data-t="labelHint"></p>
  <select id="kind"><option value="pesticide" data-t="pest"></option><option value="fertilizer" data-t="fert"></option></select>
  <h3 data-t="front"></h3><div data-pick="front"></div>
  <h3 data-t="back"></h3><div data-pick="back"></div>
  <button class="go" data-t="scan" id="labelGo"></button>
  <div class="out" id="labelOut"></div>
  <h3 data-t="history"></h3><div id="labelHist" class="histlist"></div>
 </section>
 <!-- कागजात -->
 <section id="doc" class="card">
  <h2 data-t="docH"></h2><p class="hint" data-t="docHint"></p>
  <label class="big"><input type="file" id="docFile" accept=".pdf,.txt,.md,image/*" hidden>📄 <span data-t="docUp"></span></label>
  <label class="chk"><input type="checkbox" id="ocr"> <span data-t="ocrOpt"></span></label>
  <div class="out" id="docStat"></div>
  <div id="docList" class="histlist"></div>
  <div id="docBox" hidden>
    <h3 id="docName"></h3>
    <button class="go alt" id="docSumBtn" data-t="summary"></button>
    <div class="out" id="docSum"></div>
    <div id="docLog" class="log"></div>
    <div class="askrow"><input id="docQ" data-p="docPh"><button class="mic" id="docMic">🎤</button><button class="send" id="docGo" data-t="ask"></button></div>
  </div>
 </section>
 <!-- समाचार -->
 <section id="news" class="card">
  <h2 data-t="newsH"></h2><p class="hint" data-t="newsHint"></p>
  <button class="go" id="newsRefresh" data-t="newsRefresh"></button>
  <button class="go alt" id="newsAll" data-t="newsAll"></button>
  <div class="out" id="newsStat"></div>
  <div id="newsList"></div>
 </section>
 <!-- च्याट -->
 <section id="chat" class="card">
  <div class="toolbar"><button id="chatHistBtn" data-t="oldChats"></button><button id="chatNew" data-t="newChat"></button></div>
  <div id="chatHist" class="histlist" hidden></div>
  <div id="chatCtx" class="chip" hidden></div>
  <div id="log" class="log"></div>
  <div id="chatImgChip" class="chip" hidden></div>
  <div class="askrow">
    <label class="mic"><input type="file" id="chatImg" accept="image/*" hidden>📷</label>
    <input id="chatQ" data-p="chatPh"><button class="mic" id="chatMic">🎤</button><button class="send" id="chatGo" data-t="ask"></button>
  </div>
 </section>
</main>
<div class="speedrow">🔊 <span data-t="speed"></span> <input type="range" id="rate" min="0.6" max="1.3" step="0.1" value="0.9"></div>
<footer data-t="foot"></footer>
<div id="toast" hidden></div>
<script src="/static/i18n.js"></script><script src="/static/app.js"></script>
</body></html>
